<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Room History - Luxe POS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3274e7",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111721",
                    },
                    fontFamily: { "display": ["Inter"] },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(50, 116, 231, 0.2); border-radius: 10px; }
        .dark select option { background-color: #111721; color: #f1f5f9; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-background-light dark:bg-background-dark flex flex-col h-screen shrink-0">
        <div class="p-6 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white">
                <span class="material-symbols-outlined">restaurant_menu</span>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">LUXE POS</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">PREMIUM EDITION</p>
            </div>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-2 overflow-y-auto custom-scrollbar">
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all" href="pos.html">
                <span class="material-symbols-outlined">receipt_long</span>
                <span class="font-medium">POS Terminal</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all" href="menu.html">
                <span class="material-symbols-outlined">menu_book</span>
                <span class="font-medium">Manage Menu</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary border border-primary/20" href="room_history.html">
                <span class="material-symbols-outlined">history</span>
                <span class="font-medium">History</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all" href="outside_pos.html">
                <span class="material-symbols-outlined">local_shipping</span>
                <span class="font-medium">Outside Bill</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-all" href="add_rooms.html">
                <span class="material-symbols-outlined">door_front</span>
                <span class="font-medium">Manage Rooms</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden p-6 lg:p-10">
        <header class="mb-6 flex justify-between items-end shrink-0">
            <div>
                <h2 class="text-2xl font-bold tracking-tight">Room History</h2>
                <p class="text-slate-500 mt-2 text-sm">View and manage orders for specific rooms</p>
            </div>
            <div class="flex gap-4">
                <button class="px-6 py-3 rounded-xl glass hover:bg-slate-800 transition-all font-bold text-primary" id="printSummaryBtn">Print Summary</button>
                <button class="px-6 py-3 rounded-xl bg-red-500/10 text-red-500 border border-red-500/20 font-bold hover:bg-red-500/20 transition-all" id="checkoutBtn">Checkout & Clear</button>
            </div>
        </header>

        <div class="mb-6 max-w-sm shrink-0">
            <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2">Select Room</label>
            <select class="w-full glass border-none rounded-xl py-3 px-5 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary shadow-lg" id="roomSelect">
                <option value="">-- Select a Room --</option>
            </select>
        </div>

        <div class="flex-1 overflow-y-auto pr-4 custom-scrollbar" id="historyScrollContainer">
            <div class="space-y-6 pb-10" id="historyContent">
                <div class="text-center py-20 text-slate-500 glass rounded-2xl">
                    <span class="material-symbols-outlined text-4xl mb-4">history</span>
                    <p>Select a room to view order history</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, off } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXXbo3H7h7zbKcvEuNgYH6sFVLhqkjpOo",
            authDomain: "pos-elegant.firebaseapp.com",
            databaseURL: "https://pos-elegant-default-rtdb.firebaseio.com/",
            projectId: "pos-elegant",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const roomSelect = document.getElementById("roomSelect");
        const historyContent = document.getElementById("historyContent");
        const printSummaryBtn = document.getElementById("printSummaryBtn");
        const checkoutBtn = document.getElementById("checkoutBtn");
        let currentRoom = "";
        let historyListener = null;

        // Load rooms
        onValue(ref(db, "rooms"), snapshot => {
            const currentSelection = roomSelect.value;
            roomSelect.innerHTML = `<option value="">-- Select a Room --</option>`;
            snapshot.forEach(child => {
                const room = child.val();
                const option = document.createElement("option");
                option.value = room.number;
                option.textContent = `${room.category} - ${room.number}`;
                roomSelect.appendChild(option);
            });
            roomSelect.value = currentSelection;
        });

        roomSelect.onchange = () => {
            currentRoom = roomSelect.value;
            
            // Unsubscribe from previous listener if any
            if (historyListener) {
                off(ref(db, `roomOrders/${historyListener.room}`));
            }

            if (currentRoom) {
                const historyRef = ref(db, `roomOrders/${currentRoom}`);
                onValue(historyRef, snapshot => {
                    historyContent.innerHTML = "";
                    if (!snapshot.exists()) {
                        historyContent.innerHTML = `<div class="p-10 glass rounded-2xl text-center text-slate-500">No active orders for this room</div>`;
                        return;
                    }

                    snapshot.forEach(child => {
                        const order = child.val();
                        const orderDiv = document.createElement("div");
                        orderDiv.className = "glass p-6 rounded-2xl mb-4";
                        orderDiv.innerHTML = `
                            <div class="flex justify-between items-center mb-6 pb-6 border-b border-white/5">
                                <div>
                                    <p class="text-xs font-bold text-primary uppercase tracking-widest">${order.invoice || 'N/A'}</p>
                                <p class="text-xs text-slate-500">${order.timestamp ? new Date(order.timestamp).toLocaleString() : 'No Time Data'}</p>
                                </div>
                                <div class="text-right">
                                    ${order.subTotal ? `<p class="text-[10px] text-slate-500 uppercase tracking-widest">Subtotal: Rs. ${parseFloat(order.subTotal).toLocaleString()}</p>` : ''}
                                    ${order.advancePayment > 0 ? `<p class="text-[10px] text-red-400 uppercase tracking-widest">Advance: -Rs. ${parseFloat(order.advancePayment).toLocaleString()}</p>` : ''}
                                    <p class="text-xl font-black">Rs. ${parseFloat(order.total).toLocaleString()}</p>
                                </div>
                            </div>
                            <div class="space-y-3">
                                ${order.items ? order.items.map(i => `
                                    <div class="flex justify-between text-sm">
                                        <span class="text-slate-400">${i.name} x ${i.qty}</span>
                                        <span class="font-medium italic">Rs. ${(i.price * i.qty).toLocaleString()}</span>
                                    </div>
                                `).join('') : ''}
                            </div>
                        `;
                        historyContent.appendChild(orderDiv);
                    });
                });
                historyListener = { room: currentRoom };
            } else {
                historyContent.innerHTML = `<div class="text-center py-20 text-slate-500 glass rounded-2xl"><span class="material-symbols-outlined text-4xl mb-4">history</span><p>Select a room to view order history</p></div>`;
            }
        };

        checkoutBtn.onclick = async () => {
            if (!currentRoom || currentRoom.trim() === "") return alert("Please select a room first");
            
            // Extra safety: Don't allow clearing if it's potentially a root path
            if (currentRoom.includes("/") || currentRoom.includes("..")) {
                return alert("Invalid room selection. Please contact support.");
            }

            if (confirm(`Finalize checkout and clear history for Room ${currentRoom}? \nWarning: This will permanently remove active orders for this room.`)) {
                try {
                    const roomOrderPath = `roomOrders/${currentRoom}`;
                    const targetRef = ref(db, roomOrderPath);
                    
                    await remove(targetRef);
                    
                    historyContent.innerHTML = "<div class='p-10 text-center text-green-500 font-bold'>Room Orders Cleared Successfully</div>";
                    roomSelect.value = "";
                    currentRoom = "";
                } catch (error) {
                    console.error("Checkout failed:", error);
                    alert("Checkout failed. Check your connection.");
                }
            }
        };

        printSummaryBtn.onclick = () => {
             if (!currentRoom) return alert("Select a room first");
             window.print();
        };
    </script>
</body>
</html>
